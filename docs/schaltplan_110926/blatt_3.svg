dth="2" stroke-dasharray="9 7"/><text x="320" y="606" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#173042">16 kΩ [M] – Messkopplung, kein Serien-R belegt</text><circle cx="220" cy="710" r="5" stroke="#087957" fill="#087957" stroke-width="2"/><text x="45" y="717" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#173042">P4.0V</text><line x1="220" y1="710" x2="840" y2="710" stroke="#087957" stroke-width="3"/><circle cx="840" cy="710" r="5" stroke="#087957" fill="#087957" stroke-width="2"/><text x="858" y="717" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#173042">P2.7</text><line x1="840" y1="710" x2="840" y2="760" stroke="#087957" stroke-width="3"/><circle cx="840" cy="760" r="5" stroke="#087957" fill="#087957" stroke-width="2"/><text x="858" y="767" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#173042">P2.8</text><circle cx="220" cy="838" r="5" stroke="#087957" fill="#087957" stroke-width="2"/><text x="45" y="845" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#173042">P2.1</text><line x1="220" y1="838" x2="840" y2="838" stroke="#087957" stroke-width="3"/><circle cx="840" cy="838" r="5" stroke="#087957" fill="#087957" stroke-width="2"/><text x="858" y="845" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#173042">P2.4</text><text x="365" y="871" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#173042">gemeinsame Konsolenversorgung (+12 V laut Doku)</text><rect x="990" y="537" width="400" height="268" fill="#f4f7fa" stroke="#c6d3dc" stroke-width="2"/><text x="1006" y="566" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#173042">Weitere In-Circuit-Werte</text><text x="1006" y="597" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#173042">P4.TACHO→P4.0V: 12,48 kΩ [M].</text><text x="1006" y="624" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#173042">P2.9→P2.7: 4,3 kΩ [M].</text><text x="1006" y="651" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#173042">P2/P4→erster Kontakt: 0,3–0,5 Ω,</text><text x="1006" y="678" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#173042">bei Spitzenwiderstand 0,2–0,4 Ω.</text><text x="1006" y="705" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#173042">Erste Zielpads nur pauschal erfasst.</text><text x="1006" y="732" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#173042">Kein belegter PWM-/Enable-Weg</text><text x="1006" y="759" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#173042">bis zu bestimmten OC-/MCU-Pins.</text><text x="1006" y="786" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#173042">0VA ist hier kein belegter Return.</text><line x1="35" y1="921" x2="1405" y2="921" stroke="#a8b9c5" stroke-width="1"/><text x="35" y="950" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#173042">M: Messreferenz   F: sichtbare Bahn   I: Aufdruck/Pinraster   gestrichelt: offen/Modell</text><text x="35" y="976" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#173042">0VA liegt auf Netzpotenzial. Foto-IDs und Mess-IDs sind in README.md und verbindungen.csv belegt.</text><text x="1350" y="976" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#173042">3/3</text></svg>
