l="#aa6200">Weiterweg offen</text><line x1="90" y1="230" x2="90" y2="330" stroke="#096ab1" stroke-width="3"/><circle cx="90" cy="330" r="5" stroke="#096ab1" fill="white" stroke-width="2"/><text x="55" y="363" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173042">V2 / TP2</text><line x1="400" y1="230" x2="400" y2="330" stroke="#096ab1" stroke-width="3"/><circle cx="400" cy="330" r="5" stroke="#096ab1" fill="white" stroke-width="2"/><text x="358" y="363" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173042">V1 / TP1</text><text x="530" y="330" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173042">TP1/TP2 sind Testpads, keine Vias.</text><text x="530" y="361" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173042">P1→E1: im Foto sichtbar [F]; Ω-Bestätigung noch offen.</text><rect x="50" y="420" width="430" height="160" fill="#f4f7fa" stroke="#c6d3dc" stroke-width="2"/><text x="66" y="449" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#173042">P1 · gemessene Ersatzwerte</text><text x="66" y="480" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#173042">P1→0VA: 223,7 kΩ konstant [M05].</text><text x="66" y="507" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#173042">P1→+5VA: 226,4 kΩ konstant [M06].</text><text x="66" y="534" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#173042">Kein einzelner 221-kΩ-R identifiziert.</text><text x="66" y="561" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#173042">Fusspunkt 0VA / +5VA ungeklärt.</text><rect x="505" y="420" width="430" height="160" fill="#f4f7fa" stroke="#c6d3dc" stroke-width="2"/><text x="521" y="449" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#173042">V1 · gemessene Ersatzwerte</text><text x="521" y="480" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#173042">V1→0VA: 1,211 MΩ [M10].</text><text x="521" y="507" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#173042">V1→+5VA: 1,206 MΩ [M11].</text><text x="521" y="534" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#173042">Differenz liegt im Messfehler.</text><text x="521" y="561" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#173042">Kein Nachweis der Massezuordnung.</text><rect x="960" y="420" width="430" height="160" fill="#f4f7fa" stroke="#c6d3dc" stroke-width="2"/><text x="976" y="449" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#173042">P2 · noch kein Endwert</text><text x="976" y="480" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#173042">P2→0VA: 6 MΩ, fallend [M07].</text><text x="976" y="507" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#173042">P2→L+: 0 Ω [M08].</text><text x="976" y="534" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#173042">P2→L−: 300 kΩ, steigend [M09].</text><text x="976" y="561" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#173042">Modellwerte sind keine Grenzwerte.</text><rect x="50" y="680" width="660" height="160" fill="#f4f7fa" stroke="#c6d3dc" stroke-width="2"/><text x="66" y="709" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#173042">B19: erste Fortsetzung, Auswertung bleibt offen</text><text x="66" y="740" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#173042">E1/E2: beide Pads des unteren horizontalen 1001-Widerstands.</text><text x="66" y="767" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#173042">P1–E1 prüfen: etwa Spitzenwiderstand bei intakter sichtbarer Bahn.</text><text x="66" y="794" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#173042">E1–E2 prüfen: Aufdruck 1 kΩ, eingelötet kein isolierter Nennwerttest.</text><text x="66" y="821" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#173042">Keine Zuordnung zu MCU-/Komparatorpin ohne neue Verbindung.</text><rect x="740" y="680" width="650" height="160" fill="#f4f7fa" stroke="#c6d3dc" stroke-width="2"/><text x="756" y="709" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#173042">B20: Bestand sichtbar, Netze unbekannt</text><text x="756" y="740" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#173042">Vier Widerstände und SOT-23 in E6, lokale Foto-IDs R1–R4/Ta–Tc.</text><text x="756" y="767" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#173042">Werte und Pin-Funktionen noch nicht sicher bestimmt.</text><text x="756" y="794" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#173042">Keine automatische Verbindung B20 ↔ B18 eingezeichnet.</text><text x="756" y="821" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#173042">Originalmarkierungen: Messplan Blatt 04; Makros beider Seiten nötig.</text><line x1="35" y1="921" x2="1405" y2="921" stroke="#a8b9c5" stroke-width="1"/><text x="35" y="950" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#173042">M: Messreferenz   F: sichtbare Bahn   I: Aufdruck/Pinraster   gestrichelt: offen/Modell</text><text x="35" y="976" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#173042">0VA liegt auf Netzpotenzial. Foto-IDs und Mess-IDs sind in README.md und verbindungen.csv belegt.</text><text x="1350" y="976" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#173042">2/3</text></svg>
