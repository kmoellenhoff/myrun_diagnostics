20 [I]</text><text x="723" y="540" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#173042">Pin 14 VFEED</text><text x="723" y="573" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#087957">B → Pin 14: 0 Ω [M]</text><text x="700" y="649" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#aa6200">Pin 3 OVP: Verbindung offen.</text><text x="700" y="677" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#173042">S-GND / VREF nicht 0VA / +5VA gleichsetzen.</text><text x="1090" y="490" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#173042">B19: zwei weitere 1004</text><line x1="1100" y1="550" x2="1198.0" y2="550" stroke="#087957" stroke-width="3"/><rect x="1198.0" y="536" width="74" height="28" fill="#ffffff" stroke="#087957" stroke-width="2"/><line x1="1272.0" y1="550" x2="1370" y2="550" stroke="#087957" stroke-width="3"/><text x="1180.0" y="516" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#173042">1004 oben</text><text x="1171.0" y="595" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#087957">498 kΩ [M]</text><circle cx="1100" cy="550" r="5" stroke="#087957" fill="#087957" stroke-width="2"/><circle cx="1370" cy="550" r="5" stroke="#087957" fill="#087957" stroke-width="2"/><line x1="1100" y1="660" x2="1198.0" y2="660" stroke="#087957" stroke-width="3"/><rect x="1198.0" y="646" width="74" height="28" fill="#ffffff" stroke="#087957" stroke-width="2"/><line x1="1272.0" y1="660" x2="1370" y2="660" stroke="#087957" stroke-width="3"/><text x="1180.0" y="626" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#173042">1004 unten</text><text x="1171.0" y="705" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#087957">496 kΩ [M]</text><circle cx="1100" cy="660" r="5" stroke="#087957" fill="#087957" stroke-width="2"/><circle cx="1370" cy="660" r="5" stroke="#087957" fill="#087957" stroke-width="2"/><line x1="1100" y1="550" x2="1100" y2="660" stroke="#087957" stroke-width="3"/><line x1="1370" y1="550" x2="1370" y2="660" stroke="#087957" stroke-width="3"/><text x="1090" y="728" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#173042">Je 1 MΩ [I], parallel ≈ 500 kΩ.</text><text x="1090" y="752" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#aa6200">Beide Netze: Einbindung offen.</text><rect x="45" y="780" width="650" height="133" fill="#f4f7fa" stroke="#c6d3dc" stroke-width="2"/><text x="61" y="809" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#173042">Nominalmodell / keine Betriebsmessung</text><text x="61" y="840" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#173042">B/L+ = 39,2 kΩ / (2,675 MΩ + 39,2 kΩ) ≈ 1,444 %.</text><text x="61" y="867" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#173042">5,1 V am Abgriff entsprächen rechnerisch 353,1 V am Eingang.</text><text x="61" y="894" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#173042">Unbelastetes Modell: realer Sollwert und Dynamik nicht bewiesen.</text><rect x="720" y="780" width="680" height="133" fill="#f4f7fa" stroke="#c6d3dc" stroke-width="2"/><text x="736" y="809" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#173042">Korrektur und Messgrenzen</text><text x="736" y="840" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#173042">E1–E2 ist 1003 / 100 kΩ; frühere 1-kΩ-Lesung war falsch.</text><text x="736" y="867" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#173042">P2–0VA bis 6 MΩ steigend, dann fallend; Endwert offen.</text><text x="736" y="894" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#173042">Leitfähige Rückstände möglich, nicht bewiesen. Details im Bericht.</text><line x1="35" y1="921" x2="1405" y2="921" stroke="#a8b9c5" stroke-width="1"/><text x="35" y="950" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#173042">M: Messreferenz   F: sichtbare Bahn   I: Aufdruck/Pinraster   gestrichelt: offen/Modell</text><text x="35" y="976" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#173042">0VA liegt auf Netzpotenzial. Foto-IDs und Mess-IDs sind in README.md und verbindungen.csv belegt.</text><text x="1350" y="976" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#173042">2/3</text></svg>