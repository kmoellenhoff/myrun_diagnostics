<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><title>GIRT S6T30, Blatt 4</title><rect x="0" y="0" width="1440" height="1000" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="0" y="0" width="1440" height="102" fill="#10232f" stroke="#10232f" stroke-width="2"/><text x="35" y="43" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#ffffff">Q2-C / R2211 / 1P · gemessene Netze und NPN-Kandidat</text><text x="35" y="76" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#ffffff">Pausenstand 09.11.2026 · Claude Q2/B21/B5 unverändert · Diodentest ausstehend</text><rect x="55" y="175" width="240" height="170" fill="#ffffff" stroke="#aa6200" stroke-width="2" stroke-dasharray="8 6"/><text x="75" y="208" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#173042">FAN3100C? [I]</text><text x="75" y="255" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#173042">Foto-Kontakt C</text><text x="75" y="293" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#173042">VDD nur bedingt [I]</text><circle cx="295" cy="230" r="5" stroke="#087957" fill="#087957" stroke-width="2"/><line x1="295" y1="230" x2="350" y2="230" stroke="#087957" stroke-width="3"/><line x1="350" y1="230" x2="423.0" y2="230" stroke="#087957" stroke-width="3"/><rect x="423.0" y="216" width="74" height="28" fill="#ffffff" stroke="#087957" stroke-width="2"/><line x1="497.0" y1="230" x2="570" y2="230" stroke="#087957" stroke-width="3"/><text x="405.0" y="196" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#173042">R2211 / Foto-ID R221</text><text x="396.0" y="275" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#aa6200">2,21 kΩ [I]; 2,09 kΩ [M]</text><line x1="570" y1="230" x2="740" y2="230" stroke="#087957" stroke-width="3"/><circle cx="740" cy="230" r="5" stroke="#087957" fill="#087957" stroke-width="2"/><text x="350" y="157" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#087957">C → rechte Kappe: 0 Ω [M]</text><text x="355" y="330" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#087957">Linke Kappe → O: 0 Ω [M]</text><rect x="740" y="180" width="630" height="320" fill="#ffffff" stroke="#aa6200" stroke-width="2" stroke-dasharray="8 6"/><text x="790" y="217" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#173042">1P: NPN-Kandidat [I]</text><text x="760" y="265" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173042">O: oberer Einzelanschluss, zu R221-a [M]</text><text x="760" y="294" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#aa6200">Kollektor? [I]</text><text x="790" y="345" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#173042">MMBT2222A / PMBT2222A-Familie?</text><text x="790" y="377" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#173042">Hersteller / Zusatzzeichen offen; Diodentest nicht ausgeführt.</text><circle cx="740" cy="420" r="5" stroke="#aa6200" fill="white" stroke-width="2"/><line x1="690" y1="420" x2="740" y2="420" stroke="#aa6200" stroke-width="3" stroke-dasharray="9 7"/><text x="760" y="446" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#173042">L: unten links</text><text x="760" y="475" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#aa6200">Basis? [I]</text><circle cx="1370" cy="420" r="5" stroke="#087957" fill="#087957" stroke-width="2"/><line x1="1370" y1="420" x2="1400" y2="420" stroke="#087957" stroke-width="3"/><line x1="1400" y1="420" x2="1400" y2="570" stroke="#087957" stroke-width="3"/><line x1="1120" y1="570" x2="1400" y2="570" stroke="#087957" stroke-width="3"/><circle cx="1120" cy="570" r="5" stroke="#087957" fill="#087957" stroke-width="2"/><text x="1120" y="446" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#173042">R: unten rechts</text><text x="1120" y="475" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#aa6200">Emitter? [I]</text><text x="1135" y="604" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#087957">0VA: 0 Ω beidseitig [M]</text><text x="55" y="402" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173042">Äußerer Anschlussweg gemessen.</text><text x="55" y="432" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#aa6200">Keine positive Speisung über diesen Zweig bewiesen.</text><text x="55" y="475" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#173042">O / L / R sind Foto-Hilfen, keine Herstellerpins.</text><rect x="50" y="640" width="650" height="187" fill="#f4f7fa" stroke="#c6d3dc" stroke-width="2"/><text x="66" y="669" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#173042">Weitere Ω-Anzeigen [M, in-circuit]</text><text x="66" y="700" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#173042">R221-a → +24V: 41 / 50,8 kΩ, jeweils nach etwa 20 s.</text><text x="66" y="727" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#173042">Vorher niedriger und ansteigend; spätere Stabilität offen.</text><text x="66" y="754" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#173042">L → R221-a: 4,78 kΩ; R → R221-a: 3,38 kΩ.</text><text x="66" y="781" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#173042">L → +24V: 57,5 kΩ steigend; R → +24V: 37,46 kΩ.</text><text x="66" y="808" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#173042">Nicht berichtete Gegenrichtungen bleiben leer.</text><rect x="730" y="640" width="660" height="187" fill="#f4f7fa" stroke="#c6d3dc" stroke-width="2"/><text x="746" y="669" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#173042">Modell und Fortsetzung – ausdrücklich offen</text><text x="746" y="700" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#173042">Unter NPN-Annahme: möglicher Ableit-/Belastungszweig.</text><text x="746" y="727" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#173042">Aktivierung beim Fehlstart und Fehlerursache nicht bewiesen.</text><text x="746" y="754" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#173042">Lüfter läuft laut Nutzer auch beim Fehlstart deutlich an.</text><text x="746" y="781" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#173042">Später Diodenmodus L→R und L→O, jeweils umpolen.</text><text x="746" y="808" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#173042">Keine Diodenanzeigen berichtet; keine Defektfeststellung.</text><text x="50" y="873" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#173042">Originalmakro 50396 ohne EXIF, Kontakt-PDF und sämtliche Rohangaben im verlinkten Ergebnisbericht.</text><line x1="35" y1="921" x2="1405" y2="921" stroke="#a8b9c5" stroke-width="1"/><text x="35" y="950" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#173042">M: Messreferenz   F: sichtbare Bahn   I: Aufdruck/Pinraster   gestrichelt: offen/Modell</text><text x="35" y="976" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#173042">0VA liegt auf Netzpotenzial. Foto-IDs und Mess-IDs sind in README.md und verbindungen.csv belegt.</text><text x="1350" y="976" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#173042">Nachtrag 4</text></svg>