roke-width="2"/><text x="88" y="370" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#173042">B</text><line x1="40" y1="430" x2="75" y2="430" stroke="#aa6200" stroke-width="3" stroke-dasharray="9 7"/><circle cx="40" cy="430" r="5" stroke="#aa6200" fill="white" stroke-width="2"/><text x="88" y="435" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#173042">C</text><line x1="40" y1="465" x2="75" y2="465" stroke="#aa6200" stroke-width="3" stroke-dasharray="9 7"/><circle cx="40" cy="465" r="5" stroke="#aa6200" fill="white" stroke-width="2"/><text x="88" y="470" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#173042">D5</text><text x="280" y="369" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#173042">E</text><line x1="320" y1="380" x2="360" y2="380" stroke="#096ab1" stroke-width="3"/><line x1="360" y1="380" x2="423.0" y2="380" stroke="#087957" stroke-width="3"/><rect x="423.0" y="366" width="74" height="28" fill="#ffffff" stroke="#087957" stroke-width="2"/><line x1="497.0" y1="380" x2="560" y2="380" stroke="#087957" stroke-width="3"/><text x="405.0" y="346" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#173042">Q2-RG</text><text x="396.0" y="425" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#087957">22 Ω [M]</text><text x="78" y="524" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="400" fill="#173042">E→RG-U: sichtbare Bahn [F]; Durchgang offen.</text><rect x="50" y="575" width="955" height="214" fill="#f4f7fa" stroke="#c6d3dc" stroke-width="2"/><text x="66" y="604" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#173042">Messungen sind Ersatzwerte des eingelöteten Netzes</text><text x="66" y="635" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#173042">G–S: 9,13 kΩ in beiden Richtungen (PW-M04). Kein einzelner 9,13-kΩ-Widerstand identifiziert.</text><text x="66" y="662" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#173042">G–D: 2,19 MΩ (PW-M03). Gate bis RG: etwa 0 Ω / 22 Ω (PW-M05, zusammenfassend).</text><text x="66" y="689" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#173042">Treiber A/B/C/D5/E gegen 0VA und +5VA: Werte noch offen (Messplan Blatt 05).</text><text x="66" y="716" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#173042">S→D: 0,444 V, rückwärts OL (PW-M02). D3: 0,397 V, rückwärts OL (PW-M01).</text><text x="66" y="743" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#173042">D3: Schwarz=L+ im Rohprotokoll angenommen; keine neue Bestätigung der Messpolung.</text><text x="66" y="770" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#173042">Q2 statisch unauffällig; Betriebsschalten, Versorgung und Freigabe bleiben ungeprüft.</text><text x="1080" y="135" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#173042">P600 / NTC · B5</text><line x1="1110" y1="180" x2="1110" y2="220" stroke="#096ab1" stroke-width="3"/><line x1="1320" y1="180" x2="1320" y2="220" stroke="#096ab1" stroke-width="3"/><circle cx="1110" cy="180" r="5" stroke="#096ab1" fill="white" stroke-width="2"/><circle cx="1320" cy="180" r="5" stroke="#096ab1" fill="white" stroke-width="2"/><text x="1093" y="163" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#173042">Ka</text><text x="1304" y="163" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#173042">Kb</text><line x1="1110" y1="220" x2="1178.0" y2="220" stroke="#096ab1" stroke-width="3"/><rect x="1178.0" y="206" width="74" height="28" fill="#ffffff" stroke="#096ab1" stroke-width="2"/><line x1="1252.0" y1="220" x2="1320" y2="220" stroke="#096ab1" stroke-width="3"/><text x="1160.0" y="186" font-family="DejaVu Sans,sans-serif" font-size="